# M2 (optional, cut first if late): siamese SegFormer with MiT-B1 encoder.
model: siamese_segformer
backbone: nvidia/mit-b1    # or nvidia/mit-b2 (check licence: NVIDIA, non-commercial)
pretrained: true
loss: dice_focal
class_weights: [0.10, 0.52, 0.88, 0.75, 2.74]
focal_gamma: 2.0
dice_weight: 1.0
epochs: 20
batch_size: 8
lr: 6.0e-5
encoder_lr_mult: 1.0
weight_decay: 1.0e-2
warmup_steps: 500
amp: true
seed: 0
tile_size: 512
max_train_tiles: 0
max_val_tiles: 0
