name: ci
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install ruff pytest jsonschema
      - run: pip install -e . --no-deps
      - run: ruff check src tests
      - run: pytest -q
